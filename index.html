<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端自适应核心标签 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晨语恐鬼症</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
        }
        .title {
            /* 电脑大屏字号 */
            font-size: 4rem;
            color: #f5f5f5;
            text-align: center;
        }
        /* 手机设备自动缩小字体 */
        @media (max-width: 768px) {
            .title {
                font-size: 2.2rem;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <h1 class="title">欢迎来到晨语恐鬼症</h1>
</body>
</html>
